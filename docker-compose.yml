services:
    jekyll:
        build: .
        ports:
            - "4000:4000"
            - "35729:35729" # LiveReload port
        volumes:
            - .:/app
            - /app/vendor
            - /app/.bundle
        environment:
            - JEKYLL_ENV=development
        command: bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload --force_polling
        stdin_open: true
        tty: true
