name: "Build and Deploy Jekyll Site"
on:
    push:
        branches:
            - main
            - master
        paths-ignore:
            - .gitignore
            - README.md
            - LICENSE
            - MARKDOWN_GUIDE.md
            - docker-compose.yml
            - Dockerfile
            - "vendor/**"
            - ".vscode/**"
            - ".idea/**"
            - "*.log"

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v4

            - name: Setup Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3"
                  bundler-cache: true

            - name: Build site
              run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
              env:
                  JEKYLL_ENV: "production"

            # Optional: Test the built site (uncomment if you want to add testing)
            #- name: Test site
            #  run: |
            #    bundle exec htmlproofer _site \
            #      \-\-disable-external \
            #      \-\-allow-missing-href \
            #      \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

            # Add security headers and caching rules
            - name: Add security headers
              run: |
                  cat > _site/_headers << 'EOF'
                  /*
                    X-Frame-Options: DENY
                    X-Content-Type-Options: nosniff
                    X-XSS-Protection: 1; mode=block
                    Referrer-Policy: strict-origin-when-cross-origin
                    Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'
                    Permissions-Policy: geolocation=(), microphone=(), camera=()

                  # Light caching for easy hotfixes
                  /assets/css/*
                    Cache-Control: public, max-age=3600

                  /assets/js/*
                    Cache-Control: public, max-age=3600

                  /assets/images/*
                    Cache-Control: public, max-age=3600

                  # Cache fonts (less likely to change)
                  *.woff2
                    Cache-Control: public, max-age=86400
                  *.woff
                    Cache-Control: public, max-age=86400
                  *.ttf
                    Cache-Control: public, max-age=86400

                  # Don't cache HTML files
                  *.html
                    Cache-Control: no-cache, no-store, must-revalidate
                    Pragma: no-cache
                    Expires: 300
                  EOF

            # Ensure CNAME file is preserved if it exists
            - name: Preserve CNAME
              run: |
                  if [ -f "CNAME" ]; then
                    cp CNAME _site/
                  fi

            - name: Upload site artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "_site${{ steps.pages.outputs.base_path }}"

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
